name: Linux qualification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - name: Verify source and build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked --release
          mkdir dist
          install -m 755 target/release/cargo-worktree-budget dist/cargo-worktree-budget-x86_64-unknown-linux-gnu
          cd dist
          ./cargo-worktree-budget-x86_64-unknown-linux-gnu --version
          sha256sum cargo-worktree-budget-x86_64-unknown-linux-gnu > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-x86_64
          path: dist/
          if-no-files-found: error
