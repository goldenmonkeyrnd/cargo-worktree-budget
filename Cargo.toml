[package]
name = "cargo-worktree-budget"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Lease a bounded Cargo build directory across Linux worktrees"
keywords = ["cargo", "worktree", "cache", "storage"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
